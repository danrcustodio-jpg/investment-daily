services:
  - type: web
    name: investment-daily-dashboard
    runtime: python
    plan: free
    # Keep build simple — aggressive setuptools upgrades can break older wheels.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # `python -m gunicorn` avoids relying on a `gunicorn` script on PATH.
    # Single worker keeps the cache-warm thread and in-memory _cache singular.
    # gthread + threads handles concurrent dashboard hits without extra workers.
    # --timeout 180 covers the initial yfinance scan (~2 min) on cold start.
    startCommand: python -m gunicorn dashboard:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 8 --timeout 180
    healthCheckPath: /health
    autoDeployTrigger: commit
