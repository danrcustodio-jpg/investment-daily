<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Meeting Memo</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f87171;
      --ok: #4ade80;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px 14px 32px;
      font-family: var(--font);
      background: var(--bg); color: var(--text);
      min-height: 100dvh;
      line-height: 1.45;
    }
    h1 { font-size: 1.25rem; margin: 0 0 4px; font-weight: 800; }
    .sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 18px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    button {
      flex: 1; min-width: 120px;
      padding: 14px 16px; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      background: var(--accent); color: #0f172a;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: var(--card); color: var(--text); border: 1px solid #334155; }
    button.recording { background: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: 0.88; } }
    .card {
      background: var(--card); border-radius: 14px; padding: 14px 16px;
      margin-top: 14px; border: 1px solid #334155;
    }
    .card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
    pre, .md { white-space: pre-wrap; word-break: break-word; font-size: 0.9rem; color: #e2e8f0; margin: 0; }
    .md h2 { font-size: 1rem; color: var(--accent); margin: 12px 0 6px; text-transform: none; letter-spacing: normal; }
    .md ul { margin: 6px 0; padding-left: 1.1rem; }
    .status { font-size: 0.85rem; color: var(--muted); min-height: 1.4em; }
    .err { color: var(--danger); font-size: 0.9rem; margin-top: 8px; }
    input[type="file"] { display: none; }
    a.dl { display: inline-block; margin-top: 10px; color: var(--accent); font-weight: 600; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Meeting Memo</h1>
  <p class="sub">Local only — tap to start/stop recording, or upload a file. Whisper transcript + notes (OpenAI key on this machine).</p>

  <div class="row">
    <button type="button" id="btnRec">Start recording</button>
    <label class="secondary" style="flex:1;min-width:120px;text-align:center;padding:14px;border-radius:12px;font-weight:700;border:1px solid #334155;cursor:pointer;">
      Upload audio
      <input type="file" id="fileIn" accept="audio/*,.webm,.wav,.mp3,.m4a,.mp4" />
    </label>
  </div>
  <p class="status" id="status">Idle</p>
  <p class="err" id="err" hidden></p>

  <div class="card" id="out" hidden>
    <h2>Summary</h2>
    <div class="md" id="summary"></div>
    <a class="dl" id="dlSum" href="#" download="meeting-summary.md">Download summary (.md)</a>
    <h2 style="margin-top:18px">Transcript</h2>
    <pre id="transcript"></pre>
    <a class="dl" id="dlTr" href="#" download="meeting-transcript.txt">Download transcript (.txt)</a>
  </div>

<script>
(function () {
  const btnRec = document.getElementById("btnRec");
  const fileIn = document.getElementById("fileIn");
  const status = document.getElementById("status");
  const err = document.getElementById("err");
  const out = document.getElementById("out");
  const summaryEl = document.getElementById("summary");
  const transcriptEl = document.getElementById("transcript");
  const dlSum = document.getElementById("dlSum");
  const dlTr = document.getElementById("dlTr");

  let mediaRecorder = null;
  let chunks = [];
  let mimeType = "audio/webm";
  let activeStream = null;

  function setBusy(b) {
    btnRec.disabled = b;
    fileIn.disabled = b;
  }

  function showError(msg) {
    err.hidden = false;
    err.textContent = msg;
  }
  function clearError() {
    err.hidden = true;
    err.textContent = "";
  }

  async function sendBlob(blob, filename) {
    clearError();
    setBusy(true);
    status.textContent = "Uploading and processing (may take a minute)…";
    out.hidden = true;
    const fd = new FormData();
    fd.append("audio", blob, filename || "recording.webm");
    let res;
    try {
      res = await fetch("/api/process", { method: "POST", body: fd });
    } catch (e) {
      showError("Network error: " + e);
      status.textContent = "Failed";
      setBusy(false);
      return;
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      showError(data.error || "Request failed");
      status.textContent = "Failed";
      setBusy(false);
      return;
    }
    status.textContent = "Done" + (data.language ? " · lang: " + data.language : "");
    transcriptEl.textContent = data.transcript || "";
    const sumMd = data.summary || ("_Summary failed:_ " + (data.summary_error || "unknown"));
    summaryEl.innerHTML = typeof marked !== "undefined" ? marked.parse(sumMd) : sumMd.replace(/</g, "&lt;");
    const sumBlob = new Blob([data.summary || sumMd], { type: "text/markdown" });
    const trBlob = new Blob([data.transcript || ""], { type: "text/plain" });
    dlSum.href = URL.createObjectURL(sumBlob);
    dlTr.href = URL.createObjectURL(trBlob);
    out.hidden = false;
    setBusy(false);
  }

  /* ---- MediaRecorder (mobile: prefer webm/opus) ---- */
  function pickMime() {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported("audio/webm;codecs=opus"))
      return "audio/webm;codecs=opus";
    if (window.MediaRecorder && MediaRecorder.isTypeSupported("audio/webm"))
      return "audio/webm";
    return "audio/webm";
  }

  async function startRec() {
    clearError();
    if (mediaRecorder && mediaRecorder.state === "recording") return;

    chunks = [];
    mimeType = pickMime();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      showError("Microphone blocked or unavailable. Try Upload instead.");
      return;
    }
    activeStream = stream;
    mediaRecorder = new MediaRecorder(stream, { mimeType });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      if (activeStream) {
        activeStream.getTracks().forEach((t) => t.stop());
        activeStream = null;
      }
      const ext = mimeType.includes("webm") ? "webm" : "webm";
      const blob = new Blob(chunks, { type: mimeType });
      mediaRecorder = null;
      btnRec.classList.remove("recording");
      btnRec.textContent = "Start recording";
      sendBlob(blob, "record-" + Date.now() + "." + ext);
    };
    mediaRecorder.start(250);
    btnRec.classList.add("recording");
    btnRec.textContent = "Stop recording";
    status.textContent = "Recording… tap Stop when finished.";
  }

  function stopRec() {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      status.textContent = "Stopping…";
      mediaRecorder.stop();
    }
  }

  btnRec.addEventListener("click", () => {
    if (btnRec.disabled) return;
    if (mediaRecorder && mediaRecorder.state === "recording") {
      stopRec();
    } else {
      startRec();
    }
  });

  fileIn.addEventListener("change", () => {
    const f = fileIn.files && fileIn.files[0];
    fileIn.value = "";
    if (!f) return;
    sendBlob(f, f.name);
  });

  fetch("/api/health").then((r) => r.json()).then((d) => {
    if (!d.openai_configured)
      showError("Server: OPENAI_API_KEY not set — add .env on the machine running this app.");
  }).catch(() => {});
})();
</script>
</body>
</html>
