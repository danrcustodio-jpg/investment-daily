# Deploy hawaii-trip-dashboard/ to GitHub Pages (stable URL, works on cellular).
# One-time: Repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy Hawaii trip dashboard

on:
  push:
    branches: [main]
    paths:
      - 'hawaii-trip-dashboard/**'
      - '.github/workflows/deploy-hawaii-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-hawaii-trip
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hawaii-trip-dashboard

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
