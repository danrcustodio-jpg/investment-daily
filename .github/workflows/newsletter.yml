name: Daily Newsletter

on:
  schedule:
    # 12:30 UTC = 7:30 AM EST (winter) / 8:30 AM EDT (summer)
    - cron: '30 12 * * *'
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write      # needed to commit reports back to repo

concurrency:
  group: daily-newsletter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            pip install -r requirements.txt && break
            echo "pip install failed (attempt ${attempt}/3)"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Send daily newsletter
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            python investment_daily.py && break
            echo "investment_daily.py failed (attempt ${attempt}/3)"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Generate reports
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            python generate_reports.py --newsletter --simulation && break
            echo "report generation failed (attempt ${attempt}/3)"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Commit reports to repo
        run: |
          git config user.name "Investment Daily Bot"
          git config user.email "bot@investment-daily.local"
          git add reports/ README.md sim_portfolio.json alert_state.json 2>/dev/null || true
          git stash
          git pull --rebase origin main
          git stash pop 2>/dev/null || true
          git add reports/ README.md sim_portfolio.json alert_state.json 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Newsletter — $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git push && break
            echo "git push failed (attempt ${attempt}/3)"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Add failure context to workflow summary
        if: failure()
        run: |
          {
            echo "## Daily Newsletter Failure"
            echo ""
            echo "- Repository: ${{ github.repository }}"
            echo "- Branch/Ref: ${{ github.ref }}"
            echo "- Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Trigger: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
