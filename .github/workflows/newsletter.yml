name: Daily Newsletter

on:
  schedule:
    # 12:30 UTC = 7:30 AM EST (winter) / 8:30 AM EDT (summer)
    - cron: '30 12 * * *'
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write      # needed to commit reports back to repo

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: US/Eastern calendar date (OHLCV snapshot cache key)
        run: echo "OHLCV_DAY=$(TZ=America/New_York date +%F)" >> $GITHUB_ENV

      - name: Restore strategy OHLCV daily snapshot cache
        uses: actions/cache@v4
        with:
          path: data/strategy_ohlcv_cache
          key: ohlcv-snapshot-${{ env.OHLCV_DAY }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily newsletter
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python investment_daily.py

      - name: Generate reports
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python generate_reports.py --newsletter --simulation

      - name: Commit reports to repo
        run: |
          set -e
          git config user.name "Investment Daily Bot"
          git config user.email "bot@investment-daily.local"
          git add reports/ README.md sim_portfolio.json alert_state.json 2>/dev/null || true
          git stash push -m "workflow-temp" -- 2>/dev/null || true
          git pull --rebase origin main
          git stash pop 2>/dev/null || true
          git add reports/ README.md sim_portfolio.json alert_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Newsletter — $(date -u +'%Y-%m-%d')"
          fi
          if ! git push origin HEAD:main; then
            echo "Push failed; sleeping and retrying after pull --rebase..."
            sleep 8
            git pull --rebase origin main
            git push origin HEAD:main
          fi
