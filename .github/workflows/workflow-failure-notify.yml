name: Workflow Failure Notify

on:
  workflow_run:
    workflows:
      - Strategy Alerts
      - Daily Newsletter
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: workflow-failure-notify-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Add failure details to summary
        run: |
          {
            echo "## Upstream Workflow Failed"
            echo ""
            echo "- Workflow: ${{ github.event.workflow_run.name }}"
            echo "- Conclusion: ${{ github.event.workflow_run.conclusion }}"
            echo "- Branch: ${{ github.event.workflow_run.head_branch }}"
            echo "- Actor: ${{ github.event.workflow_run.actor.login }}"
            echo "- Run URL: ${{ github.event.workflow_run.html_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send email notification if configured
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ALERT_NOTIFY_EMAIL: ${{ secrets.ALERT_NOTIFY_EMAIL }}
          DEFAULT_RECIPIENT: dan.r.custodio@gmail.com
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText

          sender = os.getenv("EMAIL_SENDER")
          password = os.getenv("EMAIL_PASSWORD")
          recipient = os.getenv("ALERT_NOTIFY_EMAIL") or os.getenv("DEFAULT_RECIPIENT")

          if not sender or not password:
              print("Email notification skipped: EMAIL_SENDER and/or EMAIL_PASSWORD missing.")
              raise SystemExit(0)

          subject = f"[InvestmentDaily] Workflow failed: {os.getenv('WORKFLOW_NAME')}"
          body = (
              f"Repository: {os.getenv('REPOSITORY')}\n"
              f"Workflow: {os.getenv('WORKFLOW_NAME')}\n"
              f"Conclusion: {os.getenv('WORKFLOW_CONCLUSION')}\n"
              f"Branch: {os.getenv('BRANCH')}\n"
              f"Run URL: {os.getenv('RUN_URL')}\n"
          )

          message = MIMEText(body, "plain", "utf-8")
          message["Subject"] = subject
          message["From"] = sender
          message["To"] = recipient

          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as smtp:
              smtp.starttls()
              smtp.login(sender, password)
              smtp.sendmail(sender, [recipient], message.as_string())

          print(f"Failure notification sent to {recipient}.")
          PY
