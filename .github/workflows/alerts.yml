name: Strategy Alerts

on:
  schedule:
    # Every 30 min during market hours window (covers both EDT and EST)
    # 13:00-21:30 UTC = ~9:00 AM - 5:30 PM ET (buffer on both sides)
    # alert_system.py exits immediately if market is actually closed
    - cron: '*/30 13-21 * * 1-5'
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write      # needed to commit reports back to repo

concurrency:
  group: strategy-alerts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            pip install -r requirements.txt && break
            echo "pip install failed (attempt ${attempt}/3)"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Run strategy alert check
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMS_GATEWAY: ${{ secrets.SMS_GATEWAY }}
          SMS_ENABLE: ${{ secrets.SMS_ENABLE }}
          SMS_COOLDOWN_HOURS: ${{ secrets.SMS_COOLDOWN_HOURS }}
          SMS_MAX_PER_SCAN: ${{ secrets.SMS_MAX_PER_SCAN }}
          # Optional: comma list (default VOO,BTC-USD). Empty secret falls back to code default.
          FOCUS_SMS_TICKERS: ${{ secrets.FOCUS_SMS_TICKERS }}
          # Optional: 1 = text only focus tickers (code default). 0 = text full watchlist.
          FOCUS_SMS_ONLY: ${{ secrets.FOCUS_SMS_ONLY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          for attempt in 1 2 3; do
            python alert_system.py && break
            echo "alert_system.py failed (attempt ${attempt}/3)"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Take simulation snapshot
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            python portfolio_sim.py --snapshot && break
            echo "portfolio_sim snapshot failed (attempt ${attempt}/3)"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Generate reports
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            python generate_reports.py --alerts --simulation && break
            echo "report generation failed (attempt ${attempt}/3)"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Commit state and reports to repo
        run: |
          git config user.name "Investment Daily Bot"
          git config user.email "bot@investment-daily.local"
          git add reports/ README.md sim_portfolio.json alert_state.json 2>/dev/null || true
          git stash
          git pull --rebase origin main
          git stash pop 2>/dev/null || true
          git add reports/ README.md sim_portfolio.json alert_state.json 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Alert scan — $(date -u +'%H:%M UTC %Y-%m-%d')"
          for attempt in 1 2 3; do
            git push && break
            echo "git push failed (attempt ${attempt}/3)"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Add failure context to workflow summary
        if: failure()
        run: |
          {
            echo "## Strategy Alerts Failure"
            echo ""
            echo "- Repository: ${{ github.repository }}"
            echo "- Branch/Ref: ${{ github.ref }}"
            echo "- Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Trigger: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
