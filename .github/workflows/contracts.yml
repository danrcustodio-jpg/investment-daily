name: Federal Contract Alerts

on:
  schedule:
    # 12:30 UTC weekdays = 7:30 AM ET (EST) / 8:30 AM ET (EDT).
    # USA Spending reporting lags 1-3 days, so a 7d lookback handles weekends.
    - cron: '30 12 * * 1-5'
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write      # needed to commit state file back to repo

concurrency:
  group: contract-alerts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            pip install -r requirements.txt && break
            echo "pip install failed (attempt ${attempt}/3)"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Run federal contract alert check
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          CONTRACT_MIN_AMOUNT: ${{ secrets.CONTRACT_MIN_AMOUNT }}
          CONTRACT_LOOKBACK_DAYS: ${{ secrets.CONTRACT_LOOKBACK_DAYS }}
        run: |
          for attempt in 1 2 3; do
            python contract_alerts.py && break
            echo "contract_alerts.py failed (attempt ${attempt}/3)"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Commit state file to repo
        run: |
          git config user.name "Investment Daily Bot"
          git config user.email "bot@investment-daily.local"
          git add contract_state.json 2>/dev/null || true
          git stash
          git pull --rebase origin main
          git stash pop 2>/dev/null || true
          git add contract_state.json 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "Contract scan — $(date -u +'%H:%M UTC %Y-%m-%d')"
          for attempt in 1 2 3; do
            git push && break
            echo "git push failed (attempt ${attempt}/3)"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Add failure context to workflow summary
        if: failure()
        run: |
          {
            echo "## Federal Contract Alerts Failure"
            echo ""
            echo "- Repository: ${{ github.repository }}"
            echo "- Branch/Ref: ${{ github.ref }}"
            echo "- Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Trigger: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
